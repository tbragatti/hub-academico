  services:
    postgres:
      image: postgres:16
      container_name: sistema-academico-postgres
      restart: unless-stopped
      environment:
        POSTGRES_USER: academico
        POSTGRES_PASSWORD: academico_dev_password
        POSTGRES_DB: sistema_academico_dev
      ports:
        - "5432:5432"
      volumes:
        - postgres_dev_data:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U academico -d sistema_academico_dev"]
        interval: 5s
        timeout: 5s
        retries: 5

  volumes:
    postgres_dev_data:
